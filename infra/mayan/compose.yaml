name: heritage-mayan

services:
  postgresql:
    image: postgres:15.17
    mem_limit: 640m
    environment:
      POSTGRES_DB: ${MAYAN_DATABASE_NAME}
      POSTGRES_USER: ${MAYAN_DATABASE_USER}
      POSTGRES_PASSWORD: ${MAYAN_DATABASE_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
    healthcheck:
      test: [CMD, pg_isready, --dbname, mayan, --username, mayan]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    volumes:
      - postgresql:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.1.8-management
    mem_limit: 384m
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${MAYAN_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${MAYAN_RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${MAYAN_RABBITMQ_VHOST}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit consumer_timeout 1800000
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, ping]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    volumes:
      - rabbitmq:/var/lib/rabbitmq

  redis:
    image: redis:7.4.8
    mem_limit: 128m
    command:
      - redis-server
      - --appendonly
      - "no"
      - --databases
      - "4"
      - --maxmemory
      - 100mb
      - --maxclients
      - "250"
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
      - --requirepass
      - ${MAYAN_REDIS_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$${MAYAN_REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      MAYAN_REDIS_PASSWORD: ${MAYAN_REDIS_PASSWORD}
    restart: unless-stopped
    volumes:
      - redis:/data

  mayan:
    image: mayanedms/mayanedms:s4.12
    mem_limit: 2300m
    cpus: 2.0
    env_file:
      - .env
    environment:
      MAYAN_CELERY_BROKER_URL: amqp://${MAYAN_RABBITMQ_USER}:${MAYAN_RABBITMQ_PASSWORD}@rabbitmq:5672/${MAYAN_RABBITMQ_VHOST}
      MAYAN_CELERY_RESULT_BACKEND: redis://:${MAYAN_REDIS_PASSWORD}@redis:6379/1
      MAYAN_DATABASES: "{'default':{'ENGINE':'django.db.backends.postgresql','NAME':'${MAYAN_DATABASE_NAME}','PASSWORD':'${MAYAN_DATABASE_PASSWORD}','USER':'${MAYAN_DATABASE_USER}','HOST':'postgresql','PORT':5432,'CONN_MAX_AGE':0}}"
      MAYAN_DOCKER_WAIT: postgresql:5432 rabbitmq:5672 redis:6379
      MAYAN_LOCK_MANAGER_BACKEND: mayan.apps.lock_manager.backends.redis_lock.RedisLock
      MAYAN_LOCK_MANAGER_BACKEND_ARGUMENTS: "{'redis_url':'redis://:${MAYAN_REDIS_PASSWORD}@redis:6379/2'}"
      MAYAN_SERVER_SIDE_EVENTS_BACKEND: mayan.apps.server_side_events.sse_backends.redis.RedisServerEventStreamBackend
      MAYAN_SERVER_SIDE_EVENTS_BACKEND_ARGUMENTS: "{'url':'redis://:${MAYAN_REDIS_PASSWORD}@redis:6379/3'}"
      MAYAN_ALLOWED_HOSTS: "['localhost','127.0.0.1']"
      # Development sizing for an 8 GB laptop. Each queue remains available,
      # but Mayan runs one process per worker class and one web worker.
      MAYAN_GUNICORN_WORKERS: ${MAYAN_GUNICORN_WORKERS:-1}
      MAYAN_WORKER_A_CONCURRENCY: ${MAYAN_WORKER_A_CONCURRENCY:-1}
      MAYAN_WORKER_B_CONCURRENCY: ${MAYAN_WORKER_B_CONCURRENCY:-1}
      MAYAN_WORKER_C_CONCURRENCY: ${MAYAN_WORKER_C_CONCURRENCY:-1}
      MAYAN_WORKER_D_CONCURRENCY: ${MAYAN_WORKER_D_CONCURRENCY:-1}
      MAYAN_WORKER_E_CONCURRENCY: ${MAYAN_WORKER_E_CONCURRENCY:-1}
      MAYAN_WORKER_F_CONCURRENCY: ${MAYAN_WORKER_F_CONCURRENCY:-1}
    ports:
      - 127.0.0.1:8082:8000
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "/opt/mayan-edms/bin/python -c \"import sys,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5); sys.exit(0 if r.status < 400 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
    restart: unless-stopped
    volumes:
      - mayan:/var/lib/mayan

volumes:
  mayan:
  postgresql:
  rabbitmq:
  redis:
