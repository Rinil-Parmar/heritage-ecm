[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archeoecm-mayan-access"
version = "0.1.0"
requires-python = ">=3.11"
description = "Read-only current-user document access API for ArcheoECM"

[tool.setuptools.packages.find]
include = ["archeoecm_access*"]
